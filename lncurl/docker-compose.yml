version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lawallet-lncurl_server_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "true"
      PROXY_AUTH_WHITELIST: "/api/*,/.well-known/*,/llms.txt,/SKILL.md,/feed.xml"
      PROXY_AUTH_BLACKLIST: "/api/setup,/api/setup/*"

  server:
    image: ghcr.io/agustinkassis/lncurl:1.0.1@sha256:c801e70cbf827609290f4e4b08b57fefd51935eacba3f3590c52a1fef14aa285
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      DATABASE_URL: "file:/data/lncurl.db"
      ALBY_HUB_URL: "${APP_LNCURL_ALBY_HUB_URL:-http://albyhub_server_1:8080}"
      AUTH_TOKEN: "${APP_LNCURL_AUTH_TOKEN:-}"
      LNCURL_ENCRYPTION_SECRET: "${APP_SEED}"
      DEV: "false"
      CHARGE_AMOUNT_SATS: "1"
      CHARGE_INTERVAL_MS: "3600000"
    restart: on-failure
    stop_grace_period: 30s
