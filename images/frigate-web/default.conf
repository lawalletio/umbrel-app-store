# Frigate dashboard: static page + Frigate's log (read-only mount of the app's data folder).
server {
    listen 80;
    root /srv;
    add_header Cache-Control no-cache; # revalidate, so an app update shows the new page

    # The page reads only the tail via a Range request.
    location = /api/log {
        alias /frigate/frigate.log;
        default_type text/plain;
        add_header Cache-Control no-store;
    }
}
