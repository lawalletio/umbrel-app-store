  - fix(lud16): label LNURL text/identifier with the address domain, not the endpoint host (#141)
  - chore(observability): remove temporary Sentry verification route (#144)
  - feat(observability): optional Sentry monitoring for web + listener (#139)

  Full release notes: https://github.com/lawalletio/lawallet-nwc/releases/tag/v2.4.0
