releaseNotes: |-
  ## Summary

  ## Highlights

  - feat(admin): link the bound remote wallet from the addresses list (#148)
  - fix(security): scope rate-limit buckets, raise webhook cap, surface JWT errors (#147)
  - fix(security): harden settings secrets, dev routes, JWT sessions, and webhook intake (#146)
