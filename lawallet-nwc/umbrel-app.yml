releaseNotes: |-
  ## Summary

  ## Highlights

  - refactor(admin): two-step login modal (method → options) (#122)
  - feat(wallet): add full-screen claim Lightning address flow (#123)
  - docs: translate roles and permissions guide (#121)
  - Add deferred Lightning address proxy settlement (#120)
  - fix(wallet): redirect /wallet/nostr-login to /wallet/signup (#118)
  - fix(wallet): funnel login "Create an account" through the signup chooser (#119)
  - refactor(wallet): rename /wallet/nostr-login to /wallet/signup (#117)
  - feat(wallet): add landing "Try Wallet" button and split Nostr sign-in onto its own screen (#116)
  - fix(docs): pin Vercel deploy config for apps/docs and declare its build env (#115)
  - fix(tooling): load prettier config under "type": "module", then format the tree (#113)
  - fix(cards): restrict card design imageUrl to http(s) schemes (#114)
  - chore(pnpm): block dependency build scripts via dual-key policy (#112)
  - fix(security): clear the Dependency Audit gate with self-retiring pins (#111)
  - feat(wallet): scan card activation QRs in-app + LNURL-withdraw support (#109)

  Full release notes: https://github.com/lawalletio/lawallet-nwc/releases/tag/v2.1.0
