releaseNotes: |-
  ## Summary

  ## Highlights

  - feat(wallet): open receive from home and simplify the send destination (#332)
  - fix(wallet): give a new cardholder their first Lightning address free (#331)
  - feat(wallet): let new cardholders start with a passkey or a Nostr key (#330)
  - feat(wallet): celebrate LUD-03 claims with a synced chest animation (#328)
  - feat(mcp): remote MCP server with OAuth 2.1 for AI agents (#317) (#327)
  - fix(settings): only send the stored listener secret to the configured listener (#326)
  - fix(wallet): replace dead courtesy LNCurl wallets before send or receive (#324)
  - feat(wallet): lead new cardholders through a passkey into the wallet (#323)
  - fix(cards): let owners rebind a card wallet from the Connection Map (#322)
  - feat(cards): LUD-19 payLink for BoltCard top-up (#316)
  - feat: BoltCard payLink and payer notes on send (#319)
  - feat(wallet): charge the receive invoice from a BoltCard tap (#313)
  - feat(wallet): simplify adding an NWC wallet (#314)
  - feat(wallet): payment sound picker and keep JWT on aborted login (#312)
  - fix(cards): drop the hardcoded 10000 sat BoltCard ceiling (#311)
  - feat(web): persist wallet currency prefs on the user (#299)
  - fix(wallet): bootstrap the account when creating a lightning address (#308)
  - chore: remove dead BalanceHeader component and nwcStatusLabel helper (#305)
  - chore: remove unused PrimaryActionButton component (#306)
  - chore: remove requirePaidRegistration dead guard (#307)
  - fix(ci): run sdk, react, listener, openapi a…

  Full release notes: https://github.com/lawalletio/lawallet-nwc/releases/tag/v2.7.2
