version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lawallet-nwc_web_1
      APP_PORT: 2288
      PROXY_AUTH_ADD: "false"

  web:
    image: masize/lawallet-nwc:2.2.0
    environment:
      NODE_ENV: production
      PORT: 2288
      DATABASE_URL: "postgresql://lawallet:${APP_PASSWORD}@postgres:5432/lawallet"
      JWT_SECRET: "${APP_SEED}"
      # NWC listener pairing — pre-wired so the integration works out of the
      # box. The web app keeps working if the listener container is down.
      LISTENER_URL: "http://lawallet-nwc_listener_1:4100"
      LISTENER_AUTH_SECRET: "${APP_SEED}-listener"
      # Encrypts RemoteWallet NWC connection strings, the settings-managed
      # LUD-16 proxy credentials and the NIP-57 receipt signer. Derived from the
      # app seed, domain-separated like LISTENER_AUTH_SECRET, so it is stable
      # across restarts and updates. Web and listener MUST agree on this value:
      # the envelopes are AES-256-GCM and only this exact secret decrypts them.
      NWC_VAULT_SECRET: "${APP_SEED}-nwc-vault"
      # Encrypts server-custodied Nostr keys created during passkey signup.
      # Without it the passkey signup path stays disabled.
      KEY_VAULT_SECRET: "${APP_SEED}-key-vault"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure"
    stop_grace_period: "1m"
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://$$(hostname -i):2288/api/health\" >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  listener:
    image: masize/lawallet-nwc-listener:2.2.0
    environment:
      DATABASE_URL: "postgresql://lawallet:${APP_PASSWORD}@postgres:5432/lawallet"
      LISTENER_PORT: 4100
      LISTENER_AUTH_SECRET: "${APP_SEED}-listener"
      # Must match the web service byte for byte — the listener decrypts the
      # NWC envelopes web wrote.
      NWC_VAULT_SECRET: "${APP_SEED}-nwc-vault"
      WEB_ORIGIN: "http://lawallet-nwc_web_1:2288"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "on-failure"
    stop_grace_period: "1m"
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4100/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    restart: "on-failure"
    environment:
      POSTGRES_USER: lawallet
      POSTGRES_PASSWORD: "${APP_PASSWORD}"
      POSTGRES_DB: lawallet
    volumes:
      - "${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawallet -d lawallet"]
      interval: 10s
      timeout: 5s
      retries: 10
