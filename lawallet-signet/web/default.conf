# Fronts the Umbrel Bitcoin dashboard unchanged and injects the Frigate tab (frigate-tab.js).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Docker DNS + a variable upstream, so a restarted bitcoind container (new IP) is re-resolved.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dashboard http://lawallet-signet_signet-bitcoind_1:3000;
    set $fulcrum_stats http://lawallet-signet_signet-fulcrum_1:8080/stats;

    location = /__frigate/tab.js {
        alias /srv/frigate-tab.js;
        default_type application/javascript;
        add_header Cache-Control no-store;
    }

    # Fulcrum's read-only stats JSON (RPC credentials are redacted by Fulcrum).
    location = /__frigate/fulcrum {
        proxy_pass $fulcrum_stats;
        proxy_http_version 1.1; # Fulcrum closes HTTP/1.0 requests
        add_header Cache-Control no-store;
    }

    # The tab reads only the tail via a Range request.
    location = /__frigate/log {
        alias /frigate/frigate.log;
        default_type text/plain;
        add_header Cache-Control no-store;
    }

    location / {
        proxy_pass $dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 1h;
        sub_filter '</body>' '<script src="/__frigate/tab.js" defer></script></body>';
        sub_filter_once on;
    }
}
