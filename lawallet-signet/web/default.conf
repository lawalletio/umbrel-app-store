# Fronts the Umbrel Bitcoin dashboard unchanged and injects the Frigate access panel.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Docker DNS + a variable upstream, so a restarted bitcoind container (new IP) is re-resolved.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dashboard http://lawallet-signet_signet-bitcoind_1:3000;

    location = /__frigate/panel.js {
        alias /srv/frigate-panel.js;
        default_type application/javascript;
        add_header Cache-Control no-store;
    }

    # The panel reads only the tail via a Range request.
    location = /__frigate/log {
        alias /frigate/frigate.log;
        default_type text/plain;
        add_header Cache-Control no-store;
    }

    location / {
        proxy_pass $dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 1h;
        sub_filter '</body>' '<script src="/__frigate/panel.js" defer></script></body>';
        sub_filter_once on;
    }
}
